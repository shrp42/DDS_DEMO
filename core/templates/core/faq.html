{% extends 'core/base.html' %}

{% block title %}FAQ / Инструкция{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto py-16 px-4">
    <h1 class="text-4xl font-bold text-center text-gray-800 mb-12">FAQ / Инструкция</h1>

    <div class="space-y-6">
        {% for item in faq_list %}
        <div class="bg-white p-6 rounded-2xl shadow hover:shadow-xl transition">
            <h2 class="text-lg font-semibold text-teal-700 mb-2">{{ item.question }}</h2>
            <p class="text-gray-700">{{ item.answer }}</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
