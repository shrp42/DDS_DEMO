<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>{% block title %}{% endblock %} / DDS_DEMO</title>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navbar -->
    <nav class="bg-white shadow-md py-4 px-8 flex justify-between items-center">

        <!-- Логотип -->
        <a href="/" class="text-2xl font-bold text-black hover:scale-105 transition duration-300 ease-in-out">
            DDS_DEMO
        </a>

        <!-- Правая часть -->
        <div class="flex items-center gap-6">

            <!-- Поиск -->
            <form method="get" action="{% url 'core:search' %}" class="relative">
                <input
                    type="text"
                    name="query"
                    value="{{ request.GET.query }}"
                    placeholder="Поиск..."
                    class="w-64 px-4 py-2 border border-black rounded-full focus:outline-none focus:ring-2 focus:ring-teal-700"
                >
                <button type="submit" class="absolute right-2 top-1/2 -translate-y-1/2 text-black hover:text-teal-700">
                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="w-6 h-6 text-black hover:text-teal-700 transition"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor">
                        <circle cx="11" cy="11" r="6" stroke-width="1.5"/>
                        <line x1="16" y1="16" x2="21" y2="21" stroke-width="1.5"/>
                    </svg>
                </button>
            </form>

            <!-- Избранное -->
            <a href="{% url 'item:favorites_list' %}" class="text-lg font-medium hover:text-teal-700 transition">
                Избранное
            </a>

            {% if request.user.is_authenticated %}
                <div class="relative group">
                    <!-- Кнопка профиля -->
                    <button
                        class="px-5 py-2 text-lg font-semibold bg-teal-700 border border-teal-700 text-white rounded-lg shadow hover:bg-teal-900 transition flex items-center gap-2">
                        {{ request.user.username }}
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </button>

                   <!-- Выпадающее меню -->
                    <div
                        class="absolute right-0 mt-2 w-40 bg-white border border-gray-200 rounded-lg shadow-lg opacity-0 invisible translate-y-2 group-hover:visible group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-500 z-50">
                        <!-- Профиль -->
                        <a href="{% url 'core:profile' %}"
                           class="flex items-center gap-2 px-5 py-3 text-gray-700 hover:bg-teal-50 hover:text-teal-700 rounded-lg transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 15c2.946 0 5.667.92 7.879 2.804M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                            Профиль
                        </a>

                        <!-- Выйти из аккаунта -->
                        <a href="{% url 'core:logout' %}"
                           class="flex items-center gap-2 px-5 py-3 text-gray-700 hover:bg-red-50 hover:text-red-600 rounded-lg transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1"/>
                            </svg>
                            Выйти
                        </a>
                    </div>
            {% else %}
                <!-- Регистрация -->
                <a href="{% url 'core:signup' %}"
                   class="px-5 py-2 text-lg font-semibold bg-teal-700 text-white rounded-lg shadow hover:bg-teal-900 transition">
                    Регистрация
                </a>

                <!-- Вход -->
                <a href="{% url 'core:login' %}"
                   class="px-5 py-2 text-lg font-semibold bg-white border border-teal-700 text-teal-700 rounded-lg shadow hover:bg-teal-700 hover:text-white transition">
                    Войти
            </a>
        {% endif %}
        </div>
    </nav>

    <!-- Main content -->
    <main class="px-8 py-10 max-w-7xl mx-auto">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-200 py-10 px-8">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between gap-10">
            <div class="md:w-2/3">
                <h3 class="text-xl font-semibold text-gray-500 mb-4">About</h3>
                <p class="text-gray-200 text-lg">DDS_DEMO is my first web project.</p>
            </div>
            <div class="md:w-1/3">
                <h3 class="text-xl font-semibold text-gray-500 mb-4">Menu</h3>
                <ul class="space-y-2">
                    <li><a href="{% url 'core:contact' %}" class="text-teal-600 hover:text-teal-900 transition">Контакты</a></li>
                    <li><a href="{% url 'core:faq' %}" class="text-teal-600 hover:text-teal-900 transition">FAQ</a></li>
                </ul>
            </div>
        </div>
        <p class="mt-10 text-center text-gray-300">&copy; 2026 DDS_DEMO.</p>
    </footer>

</body>
</html>
