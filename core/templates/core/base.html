<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>{% block title %}{% endblock %} / DDS_DEMO</title>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navbar -->
    <nav class="bg-white shadow-md py-4 px-8 flex justify-between items-center">

    <!-- Логотип -->
    <a href="/" class="text-2xl font-bold text-black hover:scale-105 transition duration-300 ease-in-out">
        DDS_DEMO
    </a>

        <!-- Правая часть -->
        <div class="flex items-center gap-6">

            <!-- Поиск -->
            <form method="get" action="/" class="relative">
                <input
                    type="text"
                    name="query"
                    placeholder="Поиск..."
                    class="w-64 px-4 py-2 border rounded-full focus:outline-none focus:ring-2 focus:ring-teal-700"
                >
                <button type="submit" class="absolute right-2 top-1/2 -translate-y-1/2 text-black hover:text-teal-700">
                   <svg xmlns="http://www.w3.org/2000/svg"
                         class="w-6 h-6 text-black hover:text-teal-700 transition"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor">
                        <circle cx="11" cy="11" r="6" stroke-width="1.5"/>
                        <line x1="16" y1="16" x2="21" y2="21" stroke-width="1.5"/>
                    </svg>

                </button>
            </form>

            <!-- Избранное -->
            <a href="#" class="text-lg font-medium hover:text-teal-700 transition">
                Избранное
            </a>

            <!-- Регистрация -->
            <a href="#" class="px-5 py-2 text-lg font-semibold bg-teal-700 text-white rounded-lg shadow hover:bg-teal-900 transition">
                Регистрация
            </a>

            <!-- Вход -->
            <a href="#" class="px-5 py-2 text-lg font-semibold bg-white border border-teal-700 text-teal-700 rounded-lg shadow hover:bg-teal-700 hover:text-white transition">
                Войти
            </a>

        </div>
    </nav>


    <!-- Main content -->
    <main class="px-8 py-10 max-w-7xl mx-auto">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-200 py-10 px-8">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-betwecden gap-10">
            <div class="md:w-2/3">
                <h3 class="text-xl font-semibold text-gray-500 mb-4">About</h3>
                <p class="text-gray-200 text-lg">DDS_DEMO is my first web project.</p>
            </div>
            <div class="md:w-1/3">
                <h3 class="text-xl font-semibold text-gray-500 mb-4">Menu</h3>
                <ul class="space-y-2">
                    <li><a href="{% url 'contact' %}" class="text-teal-600 hover:text-teal-900 transition">Контакты</a></li>
                    <li><a href="#" class="text-teal-600 hover:text-teal-900 transition">Помощь</a></li>
                </ul>
            </div>
        </div>
        <p class="mt-10 text-center text-gray-300">&copy; 2026 DDS_DEMO.</p>
    </footer>

</body>
</html>
