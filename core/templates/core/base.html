<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>{% block title %}{% endblock %} / DDS_DEMO</title>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navbar -->
    <nav class="bg-white shadow-md py-4 px-8 flex justify-between items-center">
        <a href="/" class="text-2xl font-bold text-teal-600">DDS_DEMO</a>
        <div class="space-x-4 md:space-x-6 flex items-center">
            <a href="#" class="text-lg font-medium hover:text-teal-700 transition">New Item</a>
            <a href="#" class="text-lg font-medium hover:text-teal-700 transition">Browse</a>
            <a href="#" class="px-5 py-2 text-lg font-semibold bg-teal-700 text-white rounded-lg shadow hover:bg-teal-900 transition">Sign Up</a>
            <a href="#" class="px-5 py-2 text-lg font-semibold bg-white border border-teal-700 text-teal-700 rounded-lg shadow hover:bg-teal-700 hover:text-white transition">Log In</a>
        </div>
    </nav>

    <!-- Main content -->
    <main class="px-8 py-10 max-w-7xl mx-auto">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-200 py-10 px-8">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between gap-10">
            <div class="md:w-2/3">
                <h3 class="text-xl font-semibold text-gray-500 mb-4">About</h3>
                <p class="text-gray-200 text-lg">DDS_DEMO is my first web project. Building beautiful and responsive layouts is fun with Tailwind CSS!</p>
            </div>
            <div class="md:w-1/3">
                <h3 class="text-xl font-semibold text-gray-500 mb-4">Menu</h3>
                <ul class="space-y-2">
                    <li><a href="#" class="text-teal-600 hover:text-teal-900 transition">About</a></li>
                    <li><a href="{% url 'contact' %}" class="text-teal-600 hover:text-teal-900 transition">Contact</a></li>
                    <li><a href="#" class="text-teal-600 hover:text-teal-900 transition">Help</a></li>
                </ul>
            </div>
        </div>
        <p class="mt-10 text-center text-gray-300">&copy; 2026 DDS_DEMO. All rights reserved.</p>
    </footer>

</body>
</html>
